# Local OpenBao on Rancher Desktop.
# OpenBao 2.7 no longer ships the file storage backend, so this is a single-node
# Raft server on a local-path volume. TLS is off inside the cluster.
# The Agent Injector is off; External Secrets Operator copies values into
# Kubernetes Secrets that workloads mount.
global:
  enabled: true

injector:
  enabled: false

server:
  updateStrategyType: RollingUpdate
  configAnnotation: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: local-path
  authDelegator:
    enabled: true
  readinessProbe:
    failureThreshold: 30
    initialDelaySeconds: 5
    periodSeconds: 5
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 1
    disruptionBudget:
      enabled: false
    raft:
      enabled: true

ui:
  enabled: false
