# Cluster-wide handle External Secrets uses to read OpenBao.
# Workload namespaces reference this store; they do not get the root token.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.security-secrets.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: security-secrets
            audiences:
              - vault
