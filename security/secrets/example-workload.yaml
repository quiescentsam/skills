# Sample workload that reads a secret published from OpenBao.
# Publish first:
#   bash security/secrets/publish-secret.sh default demo-credentials password=change-me
# Then:
#   kubectl apply -f security/secrets/example-workload.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-secret-example
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openbao-secret-example
  template:
    metadata:
      labels:
        app: openbao-secret-example
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "printenv DEMO_PASSWORD; sleep 3600"]
          env:
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-credentials
                  key: password
