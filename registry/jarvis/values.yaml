# Jarvis Registry on local Rancher Desktop.
# Chart: oci://ghcr.io/ascending-llc/jarvis-chart/jarvis-registry
# Runtime env (keys, Mongo password, IdP) is a Kubernetes Secret created by
# setup.sh, not this file. The chart reads it as registry-env.
# https://jarvisregistry.com/deployment-guide/

registry:
  standalone: true
  imageTag: ""

  externalSecrets:
    enabled: false

  storageClass:
    create: false

  backend:
    image:
      pullPolicy: IfNotPresent
    # The published image is amd64. On Apple Silicon it starts under emulation
    # and needs a longer probe window before it listens.
    probes:
      liveness:
        initialDelaySeconds: 240
        failureThreshold: 6
      readiness:
        initialDelaySeconds: 180
        failureThreshold: 6
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        memory: 1Gi

  frontend:
    image:
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

  authServer:
    image:
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi

  workflow:
    image:
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi

  mongodb:
    enabled: true
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        memory: 1536Mi
    persistence:
      storageClass: local-path
      size: 5Gi
    adminPasswordSecret:
      key: MONGODB_ADMIN_PASSWORD

  redis:
    enabled: true
    image:
      repository: redis
      tag: "7.4"
    persistence:
      enabled: true
      storageClass: local-path
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

  weaviate:
    enabled: true
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        memory: 1536Mi
    persistence:
      storageClass: local-path
      size: 5Gi

  monitoring:
    enabled: false
